<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dado do Chá de Panela</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#8fa480; --sage-soft:#e4eadb; --mocha:#8b6b5c; --cream:#fcfbf6; --ink:#1c1a18;
  --bg:#f1f4ea; --check:rgba(143,164,128,.38); --panel:#fcfbf6; --text:#3a2f2a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --s:min(42vw,170px);
}
:root{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--check) 50%,transparent 50%),linear-gradient(90deg,var(--check) 50%,transparent 50%);
  background-size:44px 44px;
  color:var(--text);font-family:Nunito,system-ui,sans-serif;
  display:flex;justify-content:center;padding:18px 14px 28px;
}
main{
  width:100%;max-width:440px;background:var(--panel);border-radius:6px;padding:26px 20px 24px;
  text-align:center;box-shadow:0 0 0 3px var(--sage-soft);
}
h1{font-family:"Caveat Brush",cursive;font-weight:400;font-size:clamp(46px,14vw,64px);line-height:.9;margin:0;color:var(--mocha);letter-spacing:.5px}
.names{font-family:"Caveat Brush",cursive;font-size:24px;margin:10px 0 0;color:var(--text);transform:rotate(-2deg)}
.stage{perspective:700px;height:calc(var(--s) + 90px);display:flex;align-items:center;justify-content:center}
.cube{width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(28deg);transition:transform 1.7s cubic-bezier(.15,.7,.2,1)}
.face{
  position:absolute;inset:0;border-radius:14px;background:var(--cream);color:var(--mocha);
  border:5px solid transparent;
  background-image:linear-gradient(var(--cream),var(--cream)),
    linear-gradient(var(--check) 50%,transparent 50%),linear-gradient(90deg,var(--check) 50%,transparent 50%);
  background-clip:padding-box,border-box,border-box;background-origin:border-box;background-size:auto,10px 10px,10px 10px;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%;
  backface-visibility:hidden;
}
.face i{width:78%;aspect-ratio:1;border-radius:50%;background:var(--mocha);place-self:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.face.f1 i{background:var(--sage);width:90%}
.f1{transform:rotateY(0deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
button{
  font:800 20px Nunito,sans-serif;background:var(--mocha);color:#fff;border:0;border-radius:999px;
  padding:14px 34px;cursor:pointer;min-width:200px;
}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:3px solid var(--sage);outline-offset:3px}
button:disabled{opacity:.6;cursor:default}
.card{
  margin:20px auto 0;min-height:112px;padding:14px 16px;border-radius:10px;background:var(--sage-soft);
  display:flex;flex-direction:column;justify-content:center;gap:4px;
}
.card b{font-family:"Caveat Brush",cursive;font-weight:400;font-size:30px;color:var(--mocha);line-height:1}
.card p{margin:0;font-size:18px;line-height:1.35;font-weight:600}
footer{margin-top:18px;font-family:"Caveat Brush",cursive;font-size:22px;color:var(--mocha)}
@media (prefers-reduced-motion: reduce){.cube{transition-duration:.01s}}
</style>
</head>
<body>
<main>
  <h1>Chá de Panela</h1>
  <p class="names">Ingrydh &amp; Felipe</p>

  <div class="stage" aria-hidden="true">
    <div class="cube" id="cube">
      <div class="face f1"></div>
      <div class="face f2"></div>
      <div class="face f3"></div>
      <div class="face f4"></div>
      <div class="face f5"></div>
      <div class="face f6"></div>
    </div>
  </div>

  <button id="roll" type="button">Jogar o dado</button>

</main>

<script>
// Rotação final de cada face (graus em X e Y) para deixá-la virada para frente.
var ALVO = {1:[0,0], 2:[0,-90], 3:[-90,0], 4:[90,0], 5:[0,90], 6:[0,180]};
var cube = document.getElementById("cube"), btn = document.getElementById("roll");
var ax = -24, ay = 28, ocupado = false;
// Posições dos pontinhos (grade 3x3, células 1 a 9) em cada face, como num dado normal.
var PONTOS = {1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]};
for(var f=1; f<=6; f++){
  var el = document.querySelector(".f"+f);
  PONTOS[f].forEach(function(c){
    var p = document.createElement("i");
    p.style.gridRow = Math.ceil(c/3);
    p.style.gridColumn = ((c-1)%3)+1;
    el.appendChild(p);
  });
}

function proximo(atual, alvo){
  var diff = (((alvo - atual) % 360) + 360) % 360;
  return atual + 720 + diff;
}
function jogar(){
  if(ocupado) return;
  ocupado = true; btn.disabled = true;
  var n = Math.floor(Math.random()*6)+1;
  ax = proximo(ax, ALVO[n][0]);
  ay = proximo(ay, ALVO[n][1]);
  cube.style.transform = "rotateX("+ax+"deg) rotateY("+ay+"deg)";
  var reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(function(){
    btn.textContent = "Jogar de novo";
    btn.disabled = false; ocupado = false;
  }, reduz ? 50 : 1750);
}
btn.addEventListener("click", jogar);
document.querySelector(".stage").addEventListener("click", jogar);
</script>
</body>
</html>
